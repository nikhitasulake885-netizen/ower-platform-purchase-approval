<body>
<title>Purchase Request Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="pr-style">
/* Layout: control bar, then KPI strip, then two chart rows, then the request ledger */
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--ink:#16202C;--muted:#566273;--line:#D9E0E8;
  --accent:#1F4E79;--accent-soft:#E2EBF4;--ok:#2B7A4B;--warn:#A9601A;--bad:#B03A2E;
  --ok-soft:#E3F1E8;--warn-soft:#F7EBDD;--bad-soft:#F6E2DF;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141B;--surface:#16202A;--ink:#E5EBF1;--muted:#9AA6B4;--line:#2A3644;
  --accent:#86B4E0;--accent-soft:#1D2D3E;--ok:#62C48F;--warn:#E3A55A;--bad:#EC7B6F;
  --ok-soft:#173326;--warn-soft:#3A2A17;--bad-soft:#3B1D1A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B;--surface:#16202A;--ink:#E5EBF1;--muted:#9AA6B4;--line:#2A3644;
  --accent:#86B4E0;--accent-soft:#1D2D3E;--ok:#62C48F;--warn:#E3A55A;--bad:#EC7B6F;
  --ok-soft:#173326;--warn-soft:#3A2A17;--bad-soft:#3B1D1A;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 40px;display:grid;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
h1{font-size:1.6rem;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.asof{color:var(--muted);font-size:.85rem;margin-top:4px}
.asof b{font-weight:500;color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:inherit;font-size:.9rem;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.55;cursor:default}
.msg{font-size:.88rem;padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.msg.err{background:var(--bad-soft)}
.msg.ok{background:var(--ok-soft)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:.85rem;text-align:center}
.drop.over{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.kpi .label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .value{font-family:var(--font-num);font-size:1.7rem;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.8rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.8rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-size:.95rem;font-weight:600;margin:0 0 12px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-wrap svg{width:150px;height:150px;flex:none}
.legend{display:grid;gap:8px;font-size:.88rem}
.legend div{display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .n{font-family:var(--font-num);margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;align-items:center;gap:10px;font-size:.84rem}
.bar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.bar .track,.bar .fill{display:block}
.bar .track{height:12px;background:var(--accent-soft);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:3px}
.bar .amt{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:.8rem}
.ledger{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:720px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--font-num);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-family:var(--font-num);white-space:nowrap}
.pill{display:inline-block;font-size:.75rem;font-weight:500;padding:2px 9px;border-radius:999px}
.pill.Approved{background:var(--ok-soft);color:var(--ok)}
.pill.Pending{background:var(--warn-soft);color:var(--warn)}
.pill.Rejected{background:var(--bad-soft);color:var(--bad)}
.pill.Other{background:var(--accent-soft);color:var(--accent)}
.note{font-size:.8rem;color:var(--muted)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.kpi .value{font-size:1.35rem}}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .35s ease}}
</style>

<script id="pr-main">
(function(){
  var FONT_HREF = "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap";
  var data = JSON.parse(document.getElementById("pr-data").textContent);
  var state = { cat: "All", msg: null, busy: false, readOnly: false };
  var artifactNs = null;
  var STATUS_COLORS = { Approved: "var(--ok)", Pending: "var(--warn)", Rejected: "var(--bad)" };

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function eur(n){ return "€" + Number(n || 0).toLocaleString("en-IE", { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
  function catOf(r){ return r.Category && r.Category.trim() ? r.Category : "Not set"; }
  function fmtDate(iso){ if (!iso) return "—"; var d = new Date(iso + "T00:00:00"); return isNaN(d) ? iso : d.toLocaleDateString("en-IE", { day: "numeric", month: "short", year: "numeric" }); }
  function fmtStamp(iso){ var d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString("en-IE", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); }

  function metrics(rows){
    var total = rows.length, spend = 0, by = { Approved: 0, Pending: 0, Rejected: 0 }, other = 0, days = [];
    rows.forEach(function(r){
      spend += Number(r.Amount) || 0;
      if (by.hasOwnProperty(r.Status)) by[r.Status]++; else other++;
      if (r.SubmittedDate && r.DecisionDate){
        var a = new Date(r.SubmittedDate + "T00:00:00"), b = new Date(r.DecisionDate + "T00:00:00");
        if (!isNaN(a) && !isNaN(b)) days.push(Math.round((b - a) / 86400000));
      }
    });
    var decided = by.Approved + by.Rejected;
    return {
      total: total, spend: spend, by: by, other: other,
      rate: decided ? by.Approved / decided : null, decided: decided,
      avgDays: days.length ? days.reduce(function(x, y){ return x + y; }, 0) / days.length : null
    };
  }

  function groupSum(rows, key){
    var m = {};
    rows.forEach(function(r){ var k = key(r); m[k] = (m[k] || 0) + (Number(r.Amount) || 0); });
    return Object.keys(m).map(function(k){ return { name: k, value: m[k] }; }).sort(function(a, b){ return b.value - a.value; });
  }

  function donut(by, total){
    var r = 54, c = 2 * Math.PI * r, off = 0, parts = "";
    ["Approved", "Pending", "Rejected"].forEach(function(s){
      if (!by[s] || !total) return;
      var len = by[s] / total * c;
      parts += '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="' + STATUS_COLORS[s] + '" stroke-width="20" stroke-dasharray="' + len.toFixed(2) + " " + (c - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 75 75)"></circle>';
      off += len;
    });
    return '<svg viewBox="0 0 150 150" role="img" aria-label="Requests by status: ' + by.Approved + ' approved, ' + by.Pending + ' pending, ' + by.Rejected + ' rejected">' +
      '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="20"></circle>' + parts +
      '<text x="75" y="72" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="26" font-weight="500" fill="var(--ink)">' + total + '</text>' +
      '<text x="75" y="92" text-anchor="middle" font-size="11" fill="var(--muted)">requests</text></svg>';
  }

  function bars(list){
    if (!list.length) return '<p class="note">No requests in this view.</p>';
    var max = list[0].value || 1;
    return '<div class="bars">' + list.map(function(d){
      return '<div class="bar"><span class="name" title="' + esc(d.name) + '">' + esc(d.name) + '</span><span class="track"><span class="fill" style="width:' + (d.value / max * 100).toFixed(1) + '%"></span></span><span class="amt">' + eur(d.value) + '</span></div>';
    }).join("") + '</div>';
  }

  function render(){
    var all = data.rows;
    var cats = ["All"].concat(Array.from(new Set(all.map(catOf))).sort());
    if (cats.indexOf(state.cat) < 0) state.cat = "All";
    var rows = state.cat === "All" ? all : all.filter(function(r){ return catOf(r) === state.cat; });
    var m = metrics(rows);
    var sorted = rows.slice().sort(function(a, b){ return String(b.Title).localeCompare(String(a.Title), undefined, { numeric: true }); });
    var msg = state.msg ? '<div class="msg ' + (state.msg.kind || "") + '" role="status">' + esc(state.msg.text) + '</div>' : '<div role="status" class="note" style="min-height:0"></div>';

    document.getElementById("app").innerHTML =
      '<div class="wrap">' +
      '<header class="top"><div><h1>Purchase Request Dashboard</h1>' +
      '<div class="asof">Data as of <b>' + esc(fmtStamp(data.asOf)) + '</b> · ' + esc(data.source) + '</div></div>' +
      '<div class="actions"><button class="primary" id="refreshBtn"' + (state.busy ? " disabled" : "") + '>' + (state.busy ? "Refreshing…" : "Refresh data") + '</button>' +
      '<input type="file" id="csvInput" accept=".csv,text/csv" hidden></div></header>' +
      msg +
      '<div class="drop" id="dropZone">Export the SharePoint list to CSV, then click <b>Refresh data</b> and pick the file from your folder, or drop it here.</div>' +
      '<section class="kpis" aria-label="Key figures">' +
        kpi("Total requests", String(m.total), state.cat === "All" ? "All categories" : state.cat) +
        kpi("Total spend", eur(m.spend), "Requested amount") +
        kpi("Approval rate", m.rate == null ? "—" : (m.rate * 100).toFixed(1) + "%", m.decided + " decided requests") +
        kpi("Avg days to decision", m.avgDays == null ? "—" : m.avgDays.toFixed(1), "Submitted to decision date") +
      '</section>' +
      '<div class="chips" role="group" aria-label="Filter by category">' + cats.map(function(c){
        return '<button class="chip" data-cat="' + esc(c) + '" aria-pressed="' + (c === state.cat) + '">' + esc(c) + '</button>';
      }).join("") + '</div>' +
      '<div class="row">' +
        '<section class="panel"><h2>Requests by status</h2><div class="donut-wrap">' + donut(m.by, m.total) +
          '<div class="legend">' + ["Approved", "Pending", "Rejected"].map(function(s){
            return '<div><span class="sw" style="background:' + STATUS_COLORS[s] + '"></span>' + s + '<span class="n">' + m.by[s] + '</span></div>';
          }).join("") + (m.other ? '<div><span class="sw" style="background:var(--line)"></span>Other<span class="n">' + m.other + '</span></div>' : "") + '</div></div></section>' +
        '<section class="panel"><h2>Spend by vendor</h2>' + bars(groupSum(rows, function(r){ return r.Vendor || "Not set"; })) + '</section>' +
      '</div>' +
      '<section class="panel"><h2>Spend by category</h2>' + bars(groupSum(rows, catOf)) + '</section>' +
      '<section class="panel"><h2>Request ledger</h2><div class="ledger"><table><thead><tr><th>Request</th><th>Item</th><th>Category</th><th>Vendor</th><th style="text-align:right">Amount</th><th>Status</th><th>Submitted</th><th>Decided</th><th>Approver comment</th></tr></thead><tbody>' +
        sorted.map(function(r){
          var cls = STATUS_COLORS[r.Status] ? r.Status : "Other";
          return '<tr><td class="mono">' + esc(r.Title) + '</td><td>' + esc(r.Item) + '</td><td>' + esc(catOf(r)) + '</td><td>' + esc(r.Vendor || "—") + '</td><td class="num">' + eur(r.Amount) + '</td><td><span class="pill ' + cls + '">' + esc(r.Status || "Unknown") + '</span></td><td class="mono">' + fmtDate(r.SubmittedDate) + '</td><td class="mono">' + fmtDate(r.DecisionDate) + '</td><td>' + esc(r.ApproverComments || "") + '</td></tr>';
        }).join("") +
      '</tbody></table></div></section>' +
      '</div>';
    wire();
  }

  function kpi(label, value, sub){
    return '<div class="kpi"><span class="label">' + esc(label) + '</span><span class="value">' + esc(value) + '</span><span class="sub">' + esc(sub) + '</span></div>';
  }

  function wire(){
    var btn = document.getElementById("refreshBtn"), input = document.getElementById("csvInput"), zone = document.getElementById("dropZone");
    btn.addEventListener("click", function(){ input.value = ""; input.click(); });
    input.addEventListener("change", function(){ if (input.files && input.files[0]) loadFile(input.files[0]); });
    zone.addEventListener("dragover", function(e){ e.preventDefault(); zone.classList.add("over"); });
    zone.addEventListener("dragleave", function(){ zone.classList.remove("over"); });
    zone.addEventListener("drop", function(e){ e.preventDefault(); zone.classList.remove("over"); var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(ch){
      ch.addEventListener("click", function(){ state.cat = ch.getAttribute("data-cat"); render(); });
    });
  }

  /* ---------- CSV import ---------- */
  function parseCSV(text){
    text = text.replace(/^﻿/, "");
    var rows = [], row = [], field = "", q = false;
    for (var i = 0; i < text.length; i++){
      var ch = text[i];
      if (q){
        if (ch === '"'){ if (text[i + 1] === '"'){ field += '"'; i++; } else q = false; }
        else field += ch;
      } else if (ch === '"') q = true;
      else if (ch === ","){ row.push(field); field = ""; }
      else if (ch === "\n" || ch === "\r"){
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = ""; rows.push(row); row = [];
      } else field += ch;
    }
    if (field !== "" || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(c){ return c.trim() !== ""; }); });
  }
  function norm(h){ return String(h).toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function toISO(v){
    v = String(v || "").trim(); if (!v) return "";
    var m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1] + "-" + m[2] + "-" + m[3];
    m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
    if (m){
      var a = +m[1], b = +m[2], mo, d;
      if (a > 12){ d = a; mo = b; } else if (b > 12){ mo = a; d = b; } else { mo = a; d = b; }
      return m[3] + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    }
    var t = new Date(v); return isNaN(t) ? "" : t.toISOString().slice(0, 10);
  }
  function toNum(v){ var n = parseFloat(String(v || "").replace(/[^0-9.\-]/g, "")); return isNaN(n) ? 0 : n; }

  function mapRows(table){
    var head = table[0].map(norm), idx = {};
    var want = { Title: ["title"], Item: ["item"], Category: ["category"], Amount: ["amount"], Vendor: ["vendor"], Status: ["status"],
      ApproverComments: ["approvercomments", "comments"], SubmittedDate: ["submitteddate", "created"], DecisionDate: ["decisiondate"] };
    Object.keys(want).forEach(function(k){ idx[k] = -1; want[k].some(function(n){ var p = head.indexOf(n); if (p >= 0){ idx[k] = p; return true; } return false; }); });
    var missing = ["Title", "Amount", "Status"].filter(function(k){ return idx[k] < 0; });
    if (missing.length) throw new Error("This file is missing the " + missing.join(", ") + " column. Export the Purchase Requests list from SharePoint with Export → Export to CSV.");
    return table.slice(1).map(function(r){
      function g(k){ return idx[k] >= 0 ? String(r[idx[k]] || "").trim() : ""; }
      return { Title: g("Title"), Item: g("Item"), Category: g("Category"), Amount: toNum(g("Amount")), Vendor: g("Vendor"), Status: g("Status"),
        ApproverComments: g("ApproverComments"), SubmittedDate: toISO(g("SubmittedDate")), DecisionDate: toISO(g("DecisionDate")) };
    }).filter(function(r){ return r.Title; });
  }

  function loadFile(file){
    state.busy = true; state.msg = { text: "Reading " + file.name + "…" }; render();
    var reader = new FileReader();
    reader.onerror = function(){ state.busy = false; state.msg = { kind: "err", text: "The file could not be read. Try exporting it again." }; render(); };
    reader.onload = function(){
      try {
        var table = parseCSV(String(reader.result));
        if (table.length < 2) throw new Error("The file has no request rows.");
        var rows = mapRows(table);
        if (!rows.length) throw new Error("No requests with a Title were found in the file.");
        var before = data.rows.length;
        data = { asOf: new Date().toISOString(), source: file.name, rows: rows };
        state.busy = false;
        state.msg = { kind: "ok", text: "Loaded " + rows.length + " requests from " + file.name + " (was " + before + "). Saving…" };
        render();
        save(rows.length);
      } catch (e){
        state.busy = false; state.msg = { kind: "err", text: e.message || "The file could not be read." }; render();
      }
    };
    reader.readAsText(file);
  }

  /* ---------- Save the refreshed data as a new version of this page ---------- */
  function buildDocument(){
    var resetEl = document.head && document.head.querySelector("style");
    var reset = resetEl ? resetEl.textContent : "";
    var pageStyle = document.getElementById("pr-style").textContent;
    var main = document.getElementById("pr-main").textContent;
    var json = JSON.stringify(data).replace(/</g, "\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
      '<title>Purchase Request Dashboard</title>\n' +
      '<link rel="stylesheet" href="' + FONT_HREF + '">\n' +
      '<style id="pr-style">' + pageStyle + '</style>\n' +
      '<div id="app"></div>\n' +
      '<script id="pr-data" type="application/json">' + json + '<\/script>\n' +
      '<script id="pr-main">' + main + '<\/script>' +
      '</body></html>';
  }

  function save(n){
    if (!artifactNs){
      state.msg = { kind: "ok", text: "Showing " + n + " requests for this visit. Saving isn't available in this view, so the dashboard returns to its saved data next time." };
      render(); return;
    }
    artifactNs.publish(buildDocument()).then(function(){
      state.msg = { kind: "ok", text: "Saved. The dashboard now opens with " + n + " requests." }; render();
    }).catch(function(err){
      var code = err && err.code;
      if (code === "conflict") return;
      if (code === "not_writer" || code === "not_granted"){ state.readOnly = true; state.msg = { text: "Showing " + n + " requests for this visit. You can view this dashboard but not save changes to it." }; }
      else if (code === "rate_limited"){ state.msg = { kind: "err", text: "Too many saves in a short time. Wait a minute, then refresh again." }; }
      else { state.msg = { kind: "err", text: "The new data is showing but could not be saved. Refresh again to retry." }; }
      render();
    });
  }

  render();
  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(ns){ artifactNs = ns; }).catch(function(){ artifactNs = null; });
  }
})();
</script>

</body>
</html>
